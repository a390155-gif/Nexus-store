<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registro — Nexus Store</title>
  <link rel="stylesheet" href="../css/main.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
</head>
<body>

  <nav class="navbar">
    <div class="nav-container">
      <a href="../index.html" class="nav-logo"><span class="logo-icon">⬡</span> Nexus</a>
      <ul class="nav-links" id="navLinks">
        <li><a href="../index.html" class="nav-link">Inicio</a></li>
        <li><a href="catalog.html" class="nav-link">Catálogo</a></li>
        <li><a href="cart.html" class="nav-link">Carrito <span class="cart-badge" id="cartBadge">0</span></a></li>
        <li id="authNavItem"><a href="login.html" class="nav-link">Iniciar sesión</a></li>
      </ul>
      <button class="nav-toggle" id="navToggle"><span></span><span></span><span></span></button>
    </div>
  </nav>

  <div class="auth-page">
    <div class="auth-card">
      <h1 class="auth-title">Crea tu cuenta</h1>
      <p class="auth-subtitle">Únete a Nexus Store hoy</p>

      <div class="alert alert-error" id="alertError"></div>
      <div class="alert alert-success" id="alertSuccess"></div>

      <form id="registerForm" novalidate>
        <div class="form-group">
          <label class="form-label" for="name">Nombre completo</label>
          <input type="text" id="name" class="form-input" placeholder="Tu nombre" autocomplete="name" />
          <span class="field-error" id="nameError">El nombre es obligatorio (mín. 2 caracteres)</span>
        </div>

        <div class="form-group">
          <label class="form-label" for="email">Correo electrónico</label>
          <input type="email" id="email" class="form-input" placeholder="tu@correo.com" autocomplete="email" />
          <span class="field-error" id="emailError">Ingresa un correo válido</span>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Contraseña</label>
          <input type="password" id="password" class="form-input" placeholder="Mínimo 8 caracteres" autocomplete="new-password" />
          <span class="field-error" id="passwordError">La contraseña debe tener al menos 8 caracteres</span>
        </div>

        <div class="form-group">
          <label class="form-label" for="confirmPassword">Confirmar contraseña</label>
          <input type="password" id="confirmPassword" class="form-input" placeholder="Repite tu contraseña" />
          <span class="field-error" id="confirmError">Las contraseñas no coinciden</span>
        </div>

        <button type="submit" class="form-submit" id="submitBtn">Crear cuenta</button>
      </form>

      <p class="auth-footer">
        ¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a>
      </p>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/cart.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/register.js"></script>
</body>
</html>
