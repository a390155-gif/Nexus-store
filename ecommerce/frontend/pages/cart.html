<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Carrito — Nexus Store</title>
  <link rel="stylesheet" href="../css/main.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
</head>
<body>

  <nav class="navbar">
    <div class="nav-container">
      <a href="../index.html" class="nav-logo"><span class="logo-icon">⬡</span> Nexus</a>
      <ul class="nav-links" id="navLinks">
        <li><a href="../index.html" class="nav-link">Inicio</a></li>
        <li><a href="catalog.html" class="nav-link">Catálogo</a></li>
        <li><a href="cart.html" class="nav-link active">Carrito <span class="cart-badge" id="cartBadge">0</span></a></li>
        <li id="authNavItem"><a href="login.html" class="nav-link">Iniciar sesión</a></li>
      </ul>
      <button class="nav-toggle" id="navToggle"><span></span><span></span><span></span></button>
    </div>
  </nav>

  <main>
    <div class="container">
      <div class="cart-layout">
        <!-- Lista de ítems -->
        <div>
          <h1 class="cart-title">Tu carrito</h1>
          <div id="cartItems">
            <!-- Se llena dinámicamente -->
          </div>
        </div>

        <!-- Resumen del pedido -->
        <aside class="cart-summary">
          <h2 class="summary-title">Resumen del pedido</h2>
          <div id="cartSummaryRows">
            <!-- Filas de productos -->
          </div>
          <div class="summary-total">
            <span>Total</span>
            <span id="cartTotal">$0.00</span>
          </div>
          <button class="checkout-btn" id="checkoutBtn" onclick="checkout()">
            Finalizar compra
          </button>
          <p style="color:var(--text-3);font-size:.8rem;text-align:center;margin-top:12px">
            🔒 Compra protegida con SSL
          </p>
        </aside>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container footer-inner">
      <span class="nav-logo"><span class="logo-icon">⬡</span> Nexus Store</span>
      <p class="footer-copy">© 2025 Nexus Store. Proyecto académico.</p>
    </div>
  </footer>

  <script src="../js/api.js"></script>
  <script src="../js/cart.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/cart-page.js"></script>
</body>
</html>
