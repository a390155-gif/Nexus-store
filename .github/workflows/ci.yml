name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    defaults:
      run:
        working-directory: ecommerce/backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ecommerce/backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Seed database
        env:
          MONGODB_URI: mongodb://localhost:27017/ecommerce-test
          JWT_SECRET: ci-test-secret
        run: npm run seed

      - name: Start server
        env:
          MONGODB_URI: mongodb://localhost:27017/ecommerce-test
          JWT_SECRET: ci-test-secret
          PORT: 5000
          NODE_ENV: test
        run: |
          npm start &
          for i in {1..30}; do
            if curl -sf http://localhost:5000/api/health > /dev/null; then
              echo "Server is up"
              break
            fi
            sleep 1
          done

      - name: Health check
        run: curl -f http://localhost:5000/api/health

      - name: Products endpoint
        run: curl -f http://localhost:5000/api/products

      - name: Frontend static files
        run: curl -f http://localhost:5000/index.html
