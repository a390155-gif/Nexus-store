# Despliegue automático desde GitHub en Render
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: nexus-store
    runtime: node
    rootDir: ecommerce/backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
