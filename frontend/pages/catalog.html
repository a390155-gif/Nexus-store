<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Catálogo — Nexus Store</title>
  <link rel="stylesheet" href="../css/main.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
</head>
<body>

  <nav class="navbar">
    <div class="nav-container">
      <a href="../index.html" class="nav-logo"><span class="logo-icon">⬡</span> Nexus</a>
      <ul class="nav-links" id="navLinks">
        <li><a href="../index.html" class="nav-link">Inicio</a></li>
        <li><a href="catalog.html" class="nav-link active">Catálogo</a></li>
        <li><a href="cart.html" class="nav-link">Carrito <span class="cart-badge" id="cartBadge">0</span></a></li>
        <li id="authNavItem"><a href="login.html" class="nav-link">Iniciar sesión</a></li>
      </ul>
      <button class="nav-toggle" id="navToggle"><span></span><span></span><span></span></button>
    </div>
  </nav>

  <main>
    <div class="container">
      <div class="catalog-header">
        <h1>Catálogo de productos</h1>
        <p>Explora nuestra selección de tecnología y accesorios</p>
      </div>

      <!-- Barra de búsqueda y filtros -->
      <div class="catalog-toolbar">
        <input
          type="text"
          id="searchInput"
          class="search-input"
          placeholder="Buscar productos..."
          aria-label="Buscar productos"
        />
        <select id="categoryFilter" class="filter-select">
          <option value="">Todas las categorías</option>
          <option value="Electrónica">Electrónica</option>
          <option value="Periféricos">Periféricos</option>
          <option value="Accesorios">Accesorios</option>
          <option value="Hogar">Hogar</option>
        </select>
        <select id="sortFilter" class="filter-select">
          <option value="-createdAt">Más recientes</option>
          <option value="price">Precio: menor a mayor</option>
          <option value="-price">Precio: mayor a menor</option>
          <option value="name">Nombre A–Z</option>
        </select>
      </div>

      <!-- Contador de resultados -->
      <p id="resultsCount" style="color:var(--text-2);font-size:.875rem;margin-bottom:20px"></p>

      <!-- Grid de productos -->
      <div class="products-grid" id="productsGrid">
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container footer-inner">
      <span class="nav-logo"><span class="logo-icon">⬡</span> Nexus Store</span>
      <p class="footer-copy">© 2025 Nexus Store. Proyecto académico.</p>
    </div>
  </footer>

  <script src="../js/api.js"></script>
  <script src="../js/cart.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/catalog.js"></script>
</body>
</html>
