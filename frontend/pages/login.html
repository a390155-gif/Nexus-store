<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar sesión — Nexus Store</title>
  <link rel="stylesheet" href="../css/main.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
</head>
<body>

  <nav class="navbar">
    <div class="nav-container">
      <a href="../index.html" class="nav-logo"><span class="logo-icon">⬡</span> Nexus</a>
      <ul class="nav-links" id="navLinks">
        <li><a href="../index.html" class="nav-link">Inicio</a></li>
        <li><a href="catalog.html" class="nav-link">Catálogo</a></li>
        <li><a href="cart.html" class="nav-link">Carrito <span class="cart-badge" id="cartBadge">0</span></a></li>
        <li id="authNavItem"><a href="login.html" class="nav-link active">Iniciar sesión</a></li>
      </ul>
      <button class="nav-toggle" id="navToggle"><span></span><span></span><span></span></button>
    </div>
  </nav>

  <div class="auth-page">
    <div class="auth-card">
      <h1 class="auth-title">Bienvenido</h1>
      <p class="auth-subtitle">Ingresa a tu cuenta para continuar</p>

      <!-- Alerta de error/éxito -->
      <div class="alert alert-error" id="alertError"></div>
      <div class="alert alert-success" id="alertSuccess"></div>

      <form id="loginForm" novalidate>
        <div class="form-group">
          <label class="form-label" for="email">Correo electrónico</label>
          <input
            type="email"
            id="email"
            class="form-input"
            placeholder="tu@correo.com"
            autocomplete="email"
          />
          <span class="field-error" id="emailError">Ingresa un correo válido</span>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Contraseña</label>
          <input
            type="password"
            id="password"
            class="form-input"
            placeholder="••••••••"
            autocomplete="current-password"
          />
          <span class="field-error" id="passwordError">La contraseña es obligatoria</span>
        </div>

        <button type="submit" class="form-submit" id="submitBtn">
          Iniciar sesión
        </button>
      </form>

      <p class="auth-footer">
        ¿No tienes cuenta?
        <a href="register.html">Regístrate aquí</a>
      </p>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/cart.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/login.js"></script>
</body>
</html>
